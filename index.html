<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SQL</title>
<link rel="stylesheet" href="styles.css?v=4"/>
</head>
<body>
<header class="topbar">
  <div class="top-left">
    <strong>SQL</strong>
  </div>
  <div class="top-mid">
    <button class="nav-btn" id="btnPrev" onclick="goPrev()">‹ 上一题</button>
    <span id="topTitle">第 1 题</span>
    <button class="nav-btn" id="btnNext" onclick="goNext()">下一题 ›</button>
  </div>
  <div class="top-right muted">练习模式</div>
</header>

<div class="shell">
  <nav id="nav" class="qnav" aria-label="题目列表"></nav>

  <section class="problem" id="problemPane"></section>

  <section class="workspace">
    <div class="editor-wrap" id="editorWrap">
      <div class="editor-bar">
        <span class="muted tiny">date(x,'+6 days') · AVG() OVER · strftime</span>
        <span class="grow"></span>
        <button class="ghost" onclick="resetSql()">重置</button>
      </div>
      <textarea id="sql" spellcheck="false" placeholder="在此写 SQL"></textarea>
    </div>
    <div class="quiz-editor muted" id="quizEditor">本题为选择题，请在中间题面作答。</div>
    <div class="console">
      <div class="console-bar">
        <button class="tab on" id="tabResult" onclick="showConsole('result')">执行结果</button>
        <button class="tab" id="tabHint" onclick="showConsole('hint')">提示</button>
        <span class="grow"></span>
        <button class="ghost" onclick="runTest()">自测运行</button>
        <button class="act" onclick="runJudge()">保存并提交</button>
      </div>
      <div id="consoleBody" class="console-body muted">写完 SQL 后点「自测运行」看输出，或「保存并提交」对照标准答案。</div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.11.0/sql-wasm.js"></script>
<script src="app.js?v=4"></script>
</body>
</html>
